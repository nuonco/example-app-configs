#:schema http://localhost:8081/v1/general/config-schema/app

[[rules]]
name = "new-clickhouse-tag"
trigger = "gar-tag-proof-pubsub-v2"

[[rules.filters]]
from = "payload"
path = "$.action"
op = "eq"
value = "INSERT"

[[rules.filters]]
from = "payload"
path = "$.tag"
op = "prefix"
value = "us-west1-docker.pkg.dev/nuon-gcp-support/nuon-event-proof/clickhouse-server:"

[rules.target]
type = "runbook"
runbook = "gar-release-approval-deploy"
install = "event-tag-proof-0727-1839"

[rules.target.inputs]
image_tag = "$.tag"

[[rules]]
name = "new-clickhouse-tag-branch-run"
trigger = "gar-tag-proof-pubsub-v2"

[[rules.filters]]
from = "payload"
path = "$.action"
op = "eq"
value = "INSERT"

[[rules.filters]]
from = "payload"
path = "$.tag"
op = "prefix"
value = "us-west1-docker.pkg.dev/nuon-gcp-support/nuon-event-proof/clickhouse-server:"

[rules.target]
type = "app_branch_run"
app_branch = "main"
