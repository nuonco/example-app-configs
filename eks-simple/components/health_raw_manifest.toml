# kubernetes-manifest — exercises kind discovery for raw manifests.
#
# No terraform and no helm: the kinds here are only watchable if the
# kubernetes_manifest deploy hands them to the health engine.

name      = "health_raw_manifest"
type      = "kubernetes_manifest"
namespace = "whoami"

manifest         = "./manifests/health_raw.yaml"
max_auto_retries = 2

[health]
stabilization_window = "10m"
block_deploy         = true
required_checks      = ["migrations-applied"]
