#:schema https://api.nuon.co/v1/general/config-schema?type=install

# On app branch main without fleet/wave — catch-all default group on branch runs.
# Add fleet+wave to join a selector wave, or use a dedicated app branch to leave main's train.
name = "manual-main"
app_branch = "main"
approval_option = "approve-all"

[aws_account]
region = "us-east-1"

[[inputs]]
instance_type  = "t3a.medium"
install_docker = "false"
