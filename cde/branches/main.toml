# Continuous train: installs on app_branch = "main".
# manual_only keeps the public example repo quiet; trigger runs from the CLI/UI.
name = "main"

[public_repo]
repo      = "nuonco/example-app-configs"
directory = "cde"
branch    = "main"

[run]
mode = "manual_only"

[preview]
mode          = "plan-only"
set_statuses  = false
comment       = false
ignore_drafts = true
react         = false

[preview.label_selector]
fleet = "true"
wave  = "validation"

[[install_groups]]
name  = "validation"
order = 1

[install_groups.label_selector]
fleet = "true"
wave  = "validation"

[[install_groups]]
name    = "default"
order   = 2
default = true

[install_groups.label_selector]
fleet = "true"
wave  = "default"
