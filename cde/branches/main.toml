# Continuous train: installs on app_branch = "main".
# manual_only keeps the public example repo quiet; trigger runs from the CLI/UI.
name = "main"

ignore_changes_regex     = "^([^c]|c([^d]|d([^e]|e[^/]))).*"
send_statuses_on_ignore  = true

[public_repo]
repo      = "nuonco/example-app-configs"
directory = "cde"
branch    = "main"

[run]
mode = "manual_only"

[preview]
mode          = "apply"
set_statuses  = false
comment       = false
ignore_drafts = true
react         = false

[preview.label_selector]
preview = "true"

[[install_groups]]
name    = "default"
order   = 1
default = true
