name = "main"

[public_repo]
repo      = "nuonco/example-app-configs"
directory = "cde"
branch    = "main"

[[install_groups]]
name             = "canary-front-end"
order            = 1
use_for_previews = true

[install_groups.label_selector]
canary = "true"
tier   = "front-end"

[[install_groups]]
name  = "front-end"
order = 2

[install_groups.label_selector]
prod = "true"
tier = "front-end"

[[install_groups]]
name  = "canary-full-stack"
order = 3

[install_groups.label_selector]
canary = "true"
tier   = "full-stack"

[[install_groups]]
name  = "full-stack"
order = 4

[install_groups.label_selector]
prod = "true"
tier = "full-stack"
