# Slower cadence train — deliberately far from main's continuous train.
# On a connected private repo you would use:
#   [run] mode = "on_github_label"
#   github_label = "release-weekly"
# Here we stay manual_only so the public example repo stays quiet.
name = "weekly"

[public_repo]
repo      = "nuonco/example-app-configs"
directory = "cde"
branch    = "main"

[run]
mode = "manual_only"

[[install_groups]]
name  = "preview"
order = 1

[install_groups.label_selector]
fleet = "true"
wave  = "preview"

[[install_groups]]
name  = "default"
order = 2

[install_groups.label_selector]
fleet = "true"
wave  = "default"
