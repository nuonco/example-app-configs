name        = "healthcheck_infra"
description = "End-to-end healthcheck across Kubernetes, Coder, ALB, and Coder deployment paths."
readme      = "./runbooks/healthcheck_infra.md"

[labels]
service = "infra"
type    = "report"

[[steps]]
name        = "k8s-status"
type        = "action"
action_name = "k8s_status"

[[steps]]
name        = "coder-health"
type        = "action"
action_name = "coder_health"

[[steps]]
name        = "alb-status"
type        = "action"
action_name = "alb_healthcheck"

[[steps]]
name        = "coder-deployment-health"
type        = "action"
action_name = "coder_deployment_health"
