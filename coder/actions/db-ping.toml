# action

name    = "db_ping"
timeout = "5m"
enable_kube_config = true
labels  = { service = "rds", type = "report" }

[[triggers]]
type          = "cron"
cron_schedule = "0,30 * * * *"

[[triggers]]
type = "manual"

[[steps]]
name = "db-ping"
inline_contents = '''
#!/usr/bin/env sh

set -e
set -o pipefail
set -u

echo "==> db-ping: SELECT 1 via IAM auth as $DB_USER in $CODER_NAMESPACE"

token=$(aws rds generate-db-auth-token --hostname "$DB_HOST" --port "$DB_PORT" --username "$DB_USER" --region "$REGION")
if [ -z "$token" ]; then
  echo "failed to generate RDS IAM auth token for $DB_USER@$DB_HOST" >&2
  exit 1
fi
url="postgres://${DB_USER}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require"

pod="db-ping-$(date +%s)-$$"

start=$(date +%s)
result=$(kubectl run "$pod" \
  --namespace "$CODER_NAMESPACE" \
  --rm -i --restart=Never --quiet \
  --image=postgres:16-alpine \
  --env="PGPASSWORD=$token" \
  --command -- psql "$url" -tAc 'SELECT 1;' 2>&1 || true)
end=$(date +%s)

got=$(printf '%s\n' "$result" | grep -E '^1$' | head -1 || true)
elapsed_s=$(( end - start ))

if [ "$got" = "1" ]; then
  indicator="🟢"
  rc=0
else
  indicator="🔴"
  rc=1
fi

output=$(jq --null-input -c \
  --arg indicator "$indicator" \
  --arg updated_at "$(TZ=UTC date +%Y-%m-%dT%H:%M:%SZ)" \
  --arg db_user   "$DB_USER" \
  --arg namespace "$CODER_NAMESPACE" \
  --argjson elapsed_s "$elapsed_s" \
  --arg raw "$result" \
  '{indicator: $indicator, updated_at: $updated_at, namespace: $namespace, db_user: $db_user, elapsed_s: $elapsed_s, raw: $raw}')

echo "$output" | jq .
echo "$output" >> "$NUON_ACTIONS_OUTPUT_FILEPATH"

exit $rc
'''

[steps.env_vars]
CODER_NAMESPACE = "coder"
DB_HOST         = "{{ .nuon.components.rds_cluster_coder.outputs.address }}"
DB_PORT         = "{{ .nuon.components.rds_cluster_coder.outputs.db_instance_port }}"
DB_NAME         = "{{ .nuon.components.rds_cluster_coder.outputs.db_instance_name }}"
DB_USER         = "coder"
REGION          = "{{ .nuon.install_stack.outputs.region }}"
