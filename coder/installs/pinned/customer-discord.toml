#:schema https://api.nuon.co/v1/general/config-schema?type=install

# On app branch main but omitted from install groups (no fleet=true).
# Branch runs skip it; bump Coder via installs sync on this file/folder.
name = "customer-discord"
app_branch = "main"
approval_option = "approve-all"

[labels]
channel = "pinned"
release = "{{ .nuon.install.inputs.coder_image_tag }}"

[aws_account]
region = "us-east-1"

[[inputs]]
coder_image_tag = "v2.33.8"
