#:schema https://api.nuon.co/v1/general/config-schema?type=install

# Prefer installs sync on this file/folder for Coder tag bumps.
name = "customer-discord"
app_branch = "main"
approval_option = "approve-all"

[labels]
channel = "pinned"
env     = "prod"
release = "{{ .nuon.install.inputs.coder_image_tag }}"

[aws_account]
region = "us-east-1"

[[inputs]]
coder_image_tag = "v2.33.8"
