#:schema https://api.nuon.co/v1/general/config-schema?type=install

# install
# Canary lane: validates changes before prod (install_groups order 1).
# Docs: https://docs.nuon.co/config-ref/install

name = "canary"
approval_option = "approve-all"

[labels]
canary = "true"

[aws_account]
region = "us-east-1"

# required = true in inputs.toml — Nuon demands an explicit value even
# though a default exists.
[[inputs]]
cluster_version         = "1.34"
coder_db_instance_type  = "db.t4g.micro"
