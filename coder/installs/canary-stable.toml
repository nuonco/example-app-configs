#:schema https://api.nuon.co/v1/general/config-schema?type=install

# install
# Canary lane for the stable track: validates changes before customer-2
# and customer-3 (install_groups order 1). Docs: https://docs.nuon.co/config-ref/install

name = "canary-stable"

[labels]
canary-stable = "true"

# Valid options: 'prompt' (default, requires manual approval) or 'approve-all' (automatic approval)
approval_option = "approve-all"

[aws_account]
region = "us-east-1"

# required = true in inputs.toml — Nuon demands an explicit value even
# though a default exists; values below match those defaults.
# release: 3 releases behind current stable (v2.35.4), room to demo forward.
[[inputs]]
cluster_version         = "1.34"
coder_db_instance_type  = "db.t4g.micro"
release                 = "v2.32.10"
