#:schema https://api.nuon.co/v1/general/config-schema?type=install

# Lab install for app branch main [preview] → preview-main, and validation wave.
name = "preview-main"
app_branch = "main"
approval_option = "approve-all"

[labels]
channel = "mainline"
release = "{{ .nuon.install.inputs.coder_image_tag }}"
fleet   = "true"
wave    = "validation"

[aws_account]
region = "us-east-1"

[[inputs]]
coder_image_tag = "v2.36.3"
