#:schema https://api.nuon.co/v1/general/config-schema?type=install

# Preview install for nuon branches preview (apply). On main so create/apply
# work; [preview.label_selector] still targets it.
name = "preview"
app_branch = "main"
approval_option = "approve-all"

[labels]
preview = "true"
channel = "mainline"
release = "{{ .nuon.install.inputs.coder_image_tag }}"

[aws_account]
region = "us-east-1"

[[inputs]]
coder_image_tag = "v2.36.3"
