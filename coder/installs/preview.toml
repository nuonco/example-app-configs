#:schema https://api.nuon.co/v1/general/config-schema?type=install

# Preview install for branches preview (default plan-only). Use --mode apply
# or dashboard Mode → Apply to smoke-test. On main so create/apply work.
name = "preview"
app_branch = "main"
approval_option = "approve-all"

[labels]
preview = "true"
channel = "stable"
release = "{{ .nuon.install.inputs.coder_image_tag }}"

[aws_account]
region = "us-east-1"

[[inputs]]
coder_image_tag = "v2.37.5"
