# metadata

version = "v2"

display_name = "Coder"
description  = "Cloud development environments in your AWS account, managed by Coder.com."
readme       = "./README.md"

[onboarding]
enabled        = true
category       = "self-hosted"
difficulty     = "medium"
cloud_provider = "aws"

# Colors apply per label key everywhere it appears in the dashboard (apps,
# installs, components) — one color per key, not per value. Each canary
# lane is a pale tint of the track it feeds, pairing them visually.
[label_colors]
canary-mainline = "#93C5FD"
mainline        = "#3B82F6"
canary-stable   = "#6EE7B7"
stable          = "#10B981"
