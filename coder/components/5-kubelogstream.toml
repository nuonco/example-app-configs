# helm

name           = "kubelogstream"
type           = "helm_chart"
chart_name     = "coder-logstream-kube"
namespace      = "coder"
storage_driver = "configmap"
dependencies   = ["coder"]
max_auto_retries = 5
skip_noops       = true

[helm_repo]
repo_url = "https://helm.coder.com/logstream-kube"
chart    = "coder-logstream-kube"

[[values_file]]
contents = '''
url: "https://{{.nuon.install.sandbox.outputs.nuon_dns.public_domain.name}}"

namespaces: ["coder"]

image:
  repo: "ghcr.io/coder/coder-logstream-kube"
  pullPolicy: IfNotPresent

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceAccount:
  name: coder-logstream-kube
  annotations: {}
  labels: {}
'''
