# App branch: Coder mainline train. Same git main / coder directory as
# stable; install cadence label selects the image tag at deploy time.
# Docs: https://docs.nuon.co/guides/app-branches

name = "mainline"

[public_repo]
repo      = "nuonco/example-app-configs"
directory = "coder"
branch    = "main"

[[install_groups]]
name             = "canary"
order            = 1
use_for_previews = true

[install_groups.label_selector]
canary  = "true"
cadence = "mainline"

[[install_groups]]
name  = "prod"
order = 2

[install_groups.label_selector]
prod    = "true"
cadence = "mainline"
