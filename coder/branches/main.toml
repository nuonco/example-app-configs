# Continuous train on push. Coder image tag is an install input, not a Nuon app branch.
name = "main"

ignore_changes_regex     = "^([^c]|c([^o]|o([^d]|d([^e]|e([^r]|r[^/]))))).*"
send_statuses_on_ignore  = true

[public_repo]
repo      = "nuonco/example-app-configs"
directory = "coder"
branch    = "main"

[run]
mode = "push"

[preview]
mode          = "plan-only"
set_statuses  = false
comment       = false
ignore_drafts = true
react         = false

[preview.label_selector]
preview = "true"

[[install_groups]]
name  = "stage"
order = 1

[install_groups.label_selector]
env = "stage"

[[install_groups]]
name    = "production"
order   = 2
default = true

[install_groups.label_selector]
env = "prod"
