# App branch: watches `main` and rolls changes through two independent
# release-channel lanes, each with its own canary gating its promotion:
# canary-mainline -> mainline, and canary-stable -> stable.
# Docs: https://docs.nuon.co/guides/app-branches

name = "main"

[public_repo]
repo      = "nuonco/example-app-configs"
directory = "coder"
branch    = "mm/coder-app-branch-inputs"

[[install_groups]]
name             = "canary-mainline"
order            = 1
use_for_previews = true

[install_groups.label_selector]
canary-mainline = "true"

[[install_groups]]
name             = "canary-stable"
order            = 2
use_for_previews = true

[install_groups.label_selector]
canary-stable = "true"

[[install_groups]]
name  = "mainline"
order = 3

[install_groups.label_selector]
mainline = "true"

[[install_groups]]
name  = "stable"
order = 4

[install_groups.label_selector]
stable = "true"
