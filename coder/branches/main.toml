# App branch: watches `main` and rolls changes through a single
# release-channel lane, gated by a canary: canary -> prod.
# Docs: https://docs.nuon.co/guides/app-branches

name = "main"

[public_repo]
repo      = "nuonco/example-app-configs"
directory = "coder"
branch    = "main"

[[install_groups]]
name             = "canary"
order            = 1
use_for_previews = true

[install_groups.label_selector]
canary = "true"

[[install_groups]]
name  = "prod"
order = 2

[install_groups.label_selector]
prod = "true"
