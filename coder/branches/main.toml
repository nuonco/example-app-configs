# Continuous train for the Coder app config. Same git source as always.
# Coder image version is an install input (coder_image_tag), not a Nuon app branch.
name = "main"

[public_repo]
repo      = "nuonco/example-app-configs"
directory = "coder"
branch    = "main"

[run]
mode = "manual_only"

[preview]
mode          = "plan-only"
install_name  = "preview-main"
set_statuses  = false
comment       = false
ignore_drafts = true
react         = false

[[install_groups]]
name  = "validation"
order = 1

[install_groups.label_selector]
fleet = "true"
wave  = "validation"

[[install_groups]]
name    = "default"
order   = 2
default = true

[install_groups.label_selector]
fleet = "true"
wave  = "default"
