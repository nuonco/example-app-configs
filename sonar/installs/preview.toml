# install

# app_branch required when org has disable-app-sync. No env label, so this
# install matches neither stage nor production groups on a branches trigger
# (production must not be default=true, or preview becomes the catch-all).
name = "preview"
app_branch = "main"
approval_option = "approve-all"

[labels]
preview = "true"
release = "{{ .nuon.install.inputs.sonarqube_build_number }}"

[aws_account]
region = "us-east-1"

[[inputs]]
sonarqube_build_number = "26.9.0.129388"
