[[secret]]
name         = "admin_password"
display_name = "SonarQube Admin Password"
description  = "Initial SonarQube admin password. Synced to the sonarqube namespace as sonar-admin-password."
required     = true

[[secret.kubernetes_sync_targets]]
namespaces = ["sonarqube"]
name       = "sonar-admin-password"
key        = "password"

[[secret]]
name         = "monitoring_passcode"
display_name = "Monitoring Passcode"
description  = "Passcode for SonarQube monitoring Web API authentication. Synced to the sonarqube namespace."
required     = true

[[secret.kubernetes_sync_targets]]
namespaces = ["sonarqube"]
name       = "sonar-monitoring-passcode"
key        = "passcode"
