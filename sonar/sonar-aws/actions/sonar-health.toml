# action

name    = "sonar_health"
timeout = "5m"
enable_kube_config = false
labels  = { service = "sonarqube", type = "report" }

[[triggers]]
type = "manual"

[[steps]]
name = "sonar-health"
inline_contents = '''
#!/usr/bin/env sh

set -e
set -o pipefail
set -u

url="$SONAR_URL/api/system/status"
echo "==> sonar-health: $url"

tmp=$(mktemp)
trap 'rm -f "$tmp"' EXIT

http=$(curl --silent --show-error --max-time 30 --retry 3 --retry-delay 5 \
  -o "$tmp" -w '%{http_code}' "$url")
body=$(cat "$tmp")

updated_at="$(TZ=UTC date +%Y-%m-%dT%H:%M:%SZ)"

if [ "$http" != "200" ]; then
  indicator="🔴"
  rc=1
  output=$(jq --null-input -c \
    --arg indicator "$indicator" --arg url "$url" \
    --arg updated_at "$updated_at" \
    --arg http "$http" --arg body "$body" \
    '{indicator: $indicator, updated_at: $updated_at, url: $url, http_code: $http, body: $body}')
else
  status=$(echo "$body" | jq -r '.status // "unknown"')
  version=$(echo "$body" | jq -r '.version // "unknown"')
  if [ "$status" = "UP" ]; then
    indicator="🟢"; rc=0
  else
    indicator="🔴"; rc=1
  fi
  output=$(jq --null-input -c \
    --arg indicator "$indicator" --arg url "$url" \
    --arg updated_at "$updated_at" \
    --arg status "$status" --arg version "$version" \
    '{indicator: $indicator, updated_at: $updated_at, url: $url,
      status: $status, version: $version}')
fi

echo "$output" | jq .
echo "$output" >> "$NUON_ACTIONS_OUTPUT_FILEPATH"

exit $rc
'''

[steps.env_vars]
SONAR_URL = "https://{{.nuon.install.sandbox.outputs.nuon_dns.public_domain.name}}"
