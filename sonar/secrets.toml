# secrets

[[secret]]
name         = "admin_password"
display_name = "SonarQube Admin Password"
description  = "Initial SonarQube admin password. Customer enters this as a CloudFormation parameter when applying the install stack; Nuon stores it in the customer's AWS Secrets Manager and syncs it to the sonarqube namespace. Used to replace the default admin/admin password on first boot."
required     = true

[[secret.kubernetes_sync_targets]]
namespaces = ["sonarqube"]
name       = "sonar-admin-password"
key        = "password"

[[secret]]
name         = "monitoring_passcode"
display_name = "Monitoring Passcode"
description  = "Passcode for SonarQube monitoring Web API authentication (required by the Helm chart). Customer enters this as a CloudFormation parameter; Nuon stores it in Secrets Manager and syncs it to the sonarqube namespace."
required     = true

[[secret.kubernetes_sync_targets]]
namespaces = ["sonarqube"]
name       = "sonar-monitoring-passcode"
key        = "passcode"
