apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deathstar-access
  namespace: cilium-demo
spec:
  description: >-
    Only empire ships may reach the deathstar, and then only to request landing.
    The identity match is L3, the method and path match is L7 — both are enforced
    by the same rule, so an additional L3-only rule is deliberately not created:
    Cilium policies are additive, and a broader rule would union away the L7
    restriction.
  endpointSelector:
    matchLabels:
      org: empire
      class: deathstar
  ingress:
    - fromEndpoints:
        - matchLabels:
            org: empire
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
          rules:
            http:
              - method: "POST"
                path: "/v1/request-landing"
