apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace | default .Release.Namespace | quote }}
spec:
  ports:
  - name: http-whoami
    port: {{ .Values.service.port }}
    protocol: TCP
    targetPort: {{ .Values.deployment.containerPort }}
  {{- if .Values.kernelProbe.enabled }}
  - name: http-kernel
    port: {{ .Values.kernelProbe.port }}
    protocol: TCP
    targetPort: {{ .Values.kernelProbe.port }}
  {{- end }}
  selector:
    app: {{ .Values.name }}
  sessionAffinity: None
  type: ClusterIP
