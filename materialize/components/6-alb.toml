name             = "application_load_balancer"
type             = "helm_chart"
chart_name       = "application-load-balancer"
storage_driver   = "configmap"
dependencies     = ["console_service", "certificate"]
max_auto_retries = 5
skip_noops       = true

[public_repo]
repo      = "nuonco/example-app-configs"
directory = "materialize/src/components/alb"
branch    = "mm/materialize"

[values]
domain_certificate = "{{.nuon.components.certificate.outputs.public_domain_certificate_arn}}"
domain             = "{{.nuon.install.sandbox.outputs.nuon_dns.public_domain.name}}"

https_port         = "443"
service_name       = "mz-console"
service_port       = "8080"
install_name       = "{{.nuon.install.id}}"
namespace          = "materialize-environment"
healthcheck_path   = "/"
