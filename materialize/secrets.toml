[[secret]]
name         = "license_key"
display_name = "Materialize License Key"
description  = "Self-Managed Materialize license key (Community or Enterprise). Required starting in v26. Get a Community key at https://materialize.com/self-managed/community-license/ or from the Materialize Cloud License page."
required     = true

[[secret.kubernetes_sync_targets]]
namespaces = ["materialize-environment"]
name       = "materialize-license"
key        = "license_key"
